name: PaidSonGo/Unity - VR tests with a simulated Quest

# Runs the VR Test Kit of the separate public project PaidSonGo/Unity (docs/VR_TESTING.md there) with THIS
# repository's Unity Personal licence secrets UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD. The secrets never
# leave this repository: the other project is checked out into ./unity and tested here. Nothing in
# UnityProject/, the Dyrygent executor or paidsongo-unity-ci.yml is used or changed.
#
# Start: push a change of .ci/vrtest-target.txt (game ref, harness ref, filter) on this branch.
# Results:
#   - job summary + artifact "vrtest-sim" (report.json, *_L/_R/_SBS.png, summary.md per scenario)
#   - branch vrtest-results of THIS repository, folder results/<PaidSonGo/Unity game sha>/sim/
#     Agents: git remote add fantasytd https://github.com/PaidSonGo/FantasyTD
#             python3 tools/vrtest/vrtest.py results --remote fantasytd --sha <game sha>
# A run FAILS when Unity cannot run, when zero tests executed, or when a scenario/test fails.
on:
  push:
    branches: [ccr-c8d70e9f-nb5txu]
    paths: [".ci/vrtest-target.txt", ".github/workflows/paidsongo-vrtest.yml"]

permissions:
  contents: write   # publish results to the vrtest-results branch of this repository
  checks: write     # game-ci posts the test results as a check run

concurrency:
  group: paidsongo-vrtest
  cancel-in-progress: true

jobs:
  sim:
    name: Unity Editor + simulated Quest (EditMode + PlayMode)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Licence check (fails when Unity cannot run)
        run: |
          missing=""
          [ -n "$UNITY_LICENSE" ] || missing="$missing UNITY_LICENSE"
          [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error title=Unity NOT VERIFIED::Missing secrets:$missing"; exit 1; fi

      - uses: actions/checkout@v4

      - name: Read target
        id: t
        run: |
          set -euo pipefail
          get() { sed -n "s/^$1=//p" .ci/vrtest-target.txt | head -1; }
          game=$(get game); harness=$(get harness); filter=$(get filter)
          [ -n "$game" ] || { echo "::error::game= is empty in .ci/vrtest-target.txt"; exit 1; }
          for v in "$game" "$harness"; do
            if ! [[ "$v" =~ ^[A-Za-z0-9._/-]*$ ]]; then echo "::error::invalid ref '$v'"; exit 1; fi
          done
          if ! [[ "$filter" =~ ^[A-Za-z0-9_.,-]*$ ]]; then echo "::error::invalid filter '$filter'"; exit 1; fi
          { echo "game=$game"; echo "harness=${harness:-none}"; echo "filter=$filter"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: PaidSonGo/Unity
          ref: ${{ steps.t.outputs.game }}
          path: unity
          lfs: true

      - uses: actions/checkout@v4
        if: steps.t.outputs.harness != 'none'
        with:
          repository: PaidSonGo/Unity
          ref: ${{ steps.t.outputs.harness }}
          path: harness

      - name: Overlay the VR Test Kit on the game
        id: overlay
        env:
          HARNESS: ${{ steps.t.outputs.harness }}
        run: |
          set -euo pipefail
          echo "game_sha=$(git -C unity rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$HARNESS" = "none" ]; then echo "harness_sha=none" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "harness_sha=$(git -C harness rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          for p in Assets/_Project/Runtime/VRTest Assets/_Project/Editor/VRTest Assets/_Project/Tests/Editor/VRTest \
                   Assets/_Project/Tests/PlayMode/XRSim VRTests tools/vrtest; do
            for m in "$p" "$p.meta"; do [ -e "harness/$m" ] || continue
              rm -rf "unity/$m"; mkdir -p "unity/$(dirname "$m")"; cp -a "harness/$m" "unity/$m"; echo "overlaid $m"
            done
          done
          # Folder .meta files that the kit's folders need but the game branch may lack.
          python3 - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path("unity")
          base = root / "Assets/_Project"
          for d in [base] + sorted(base.rglob("*")):
              meta = pathlib.Path(str(d) + ".meta")
              if d.is_dir() and not meta.exists() and not any(p.startswith(".") for p in d.parts):
                  rel = d.relative_to(root).as_posix()
                  meta.write_text(f"fileFormatVersion: 2\nguid: {hashlib.md5(rel.encode()).hexdigest()}\nfolderAsset: yes\n"
                                  "DefaultImporter:\n  externalObjects: {}\n  userData: \n  assetBundleName: \n  assetBundleVariant: \n")
                  print("folder meta", rel)
          PY

      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: unity-library-vrtest-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-${{ steps.overlay.outputs.game_sha }}
          restore-keys: unity-library-vrtest-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-

      - name: Results folder owned by the runner (Unity writes inside it from the container)
        run: mkdir -p unity/VRTestResults && chmod 777 unity/VRTestResults

      - uses: game-ci/unity-test-runner@v4
        id: tests
        continue-on-error: true
        with:
          projectPath: unity
          testMode: all
          artifactsPath: test-results
          customParameters: ${{ steps.t.outputs.filter != '' && format('-vrtestFilter {0}', steps.t.outputs.filter) || '' }}

      - name: Summarize
        if: always()
        env:
          GAME_SHA: ${{ steps.overlay.outputs.game_sha }}
          HARNESS_SHA: ${{ steps.overlay.outputs.harness_sha }}
        run: |
          set -uo pipefail
          sudo chown -R "$(id -u):$(id -g)" unity/VRTestResults test-results 2>/dev/null || true
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          total = passed = failed = 0
          lines = []
          for f in glob.glob("test-results/**/*.xml", recursive=True):
              root = ET.parse(f).getroot()
              total += int(root.get("total", "0")); passed += int(root.get("passed", "0")); failed += int(root.get("failed", "0"))
              for case in root.iter("test-case"):
                  if case.get("result") == "Failed":
                      msg = case.find("./failure/message")
                      lines.append(f"- FAILED {case.get('fullname')}: {(msg.text or '').strip()[:600] if msg is not None else ''}")
          text = (f"Unity tests: total={total} passed={passed} failed={failed}\n"
                  f"game PaidSonGo/Unity@{os.environ['GAME_SHA']}  harness@{os.environ['HARNESS_SHA']}\n" + "\n".join(lines) + "\n")
          print(text)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(text)
          open("unity/VRTestResults/unity-tests.txt", "w").write(text)
          open("unity-totals.env", "w").write(f"TOTAL={total}\nFAILED={failed}\n")
          PY
          cp -r test-results unity/VRTestResults/test-results 2>/dev/null || true
          python3 unity/tools/vrtest/vrtest.py summarize unity/VRTestResults --sha "$GAME_SHA" --label sim --github-summary || true

      - name: Publish to vrtest-results (this repository)
        if: always() && steps.overlay.outputs.game_sha != ''
        env:
          GAME_SHA: ${{ steps.overlay.outputs.game_sha }}
          HARNESS_SHA: ${{ steps.overlay.outputs.harness_sha }}
          GAME_REF: ${{ steps.t.outputs.game }}
        run: |
          git config --global user.name vrtest-bot
          git config --global user.email vrtest-bot@users.noreply.github.com
          python3 unity/tools/vrtest/vrtest.py publish unity/VRTestResults --sha "$GAME_SHA" --label sim \
            --ref "$GAME_REF" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (harness $HARNESS_SHA)" \
            --repo . --remote origin

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrtest-sim
          path: unity/VRTestResults
          if-no-files-found: warn
          retention-days: 14

      - name: Gate (fails on zero executed tests or any failure)
        if: always()
        run: |
          [ -f unity-totals.env ] || { echo "::error title=Unity NOT VERIFIED::no test summary"; exit 1; }
          . ./unity-totals.env
          if [ "${TOTAL:-0}" = "0" ]; then echo "::error title=Unity NOT VERIFIED::zero executed tests"; exit 1; fi
          if [ "${FAILED:-0}" != "0" ]; then echo "::error::$FAILED Unity test(s) failed"; exit 1; fi
          status=$(python3 -c "import json;print(json.load(open('unity/VRTestResults/summary.json'))['status'])" 2>/dev/null || echo UNKNOWN)
          echo "VR scenarios overall: $status"
          case "$status" in PASS|WARN|SKIPPED) exit 0;; *) exit 1;; esac
